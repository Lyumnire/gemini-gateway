name: gemini-gateway

services:
  # Gemini Web → OpenAI 兼容 API（社区开源项目，无需 API Key）
  # 官方 GHCR 镜像只有 amd64，用 vendor 的上游源码构建原生 arm64 镜像
  # 构建：./scripts/build-backend.sh   更新：cd backend/src && git pull && ./scripts/build-backend.sh && docker compose up -d gemini-api
  gemini-api:
    image: gemini-web-to-api:local
    container_name: gg-gemini-api
    restart: unless-stopped
    environment:
      - GEMINI_1PSID=${GEMINI_1PSID:-}
      - GEMINI_1PSIDTS=${GEMINI_1PSIDTS:-}
      - GEMINI_REFRESH_INTERVAL=${GEMINI_REFRESH_INTERVAL:-30}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-3}
      - GEMINI_TEMPORARY=${GEMINI_TEMPORARY:-false}
      # 完整 Google 登录 Cookie（图片代理通过 Clash 下载 Google CDN 图片用）
      - GEMINI_GOOGLE_COOKIES=${GEMINI_GOOGLE_COOKIES:-}
      - APP_ENV=production
      - PORT=4981
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-30}
      # 官网模型别名 → 动态令牌（由 docs/capture-model-id.md 抓包获得）
      - GEMINI_MODEL_ALIASES=${GEMINI_MODEL_ALIASES:-}
      # 用户系统：JWT + SQLite
      - GATEWAY_JWT_SECRET=${GATEWAY_JWT_SECRET:-}
      - GATEWAY_INVITE_CODE=${GATEWAY_INVITE_CODE:-}
      - GATEWAY_DB_PATH=/data/gateway.db
      # 强制所有上游 Google 请求经过宿主机代理，严禁直连
      # 默认值适配 Docker Desktop / Linux（host.docker.internal）；OrbStack 用户请在 .env 设置 host.orb.internal
      - HTTPS_PROXY=${GATEWAY_PROXY_URL:-http://host.docker.internal:7890}
      - HTTP_PROXY=${GATEWAY_PROXY_URL:-http://host.docker.internal:7890}
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      # 持久化 cookie 缓存：重启后登录态不丢
      - ./data/cookies:/home/appuser/.cookies
      # SQLite 数据库持久化
      - ./data/db:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # unset 代理：OrbStack 会向容器注入 http(s)_proxy，busybox wget 会遵守，
      # 导致健康检查被转发到宿主机 Clash 而误报 502
      test: ["CMD", "sh", "-c", "unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY; wget -qO- http://127.0.0.1:4981/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [gg]

  # 入口网关：密码认证 + 托管前端 + 反代 API（唯一对内对外端口）
  caddy:
    image: caddy:2-alpine
    container_name: gg-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # 容器被注入系统代理时，反代到内部容器名的请求会被误发给 Clash 导致挂起；
      # 这里豁免内部通信
      - NO_PROXY=localhost,127.0.0.1,gemini-api,192.168.97.0/24
      - no_proxy=localhost,127.0.0.1,gemini-api,192.168.97.0/24
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gemini-api]
    networks: [gg]

  # Cloudflare Tunnel: 在 Mac mini 主机上通过 launchd 直接运行 cloudflared
  # 不走代理、不进 Docker，直连 Cloudflare edge（避免代理 IP 被拦截）
  # 管理：launchctl stop/start com.cloudflare.cloudflared
  # 日志：tail -f /tmp/cloudflared.log

networks:
  gg:

volumes:
  caddy_data:
  caddy_config:
